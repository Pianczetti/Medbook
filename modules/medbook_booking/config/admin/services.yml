  # =========================================================================
  # Settings Form Handler
  # =========================================================================
  MedBook\Booking\Form\SettingsDataProvider: ~

  medbook_booking.form.settings_form_handler:
    class: 'PrestaShop\PrestaShop\Core\Form\Handler'
    public: true
    arguments:
      $formFactory: '@form.factory'
      $hookDispatcher: '@prestashop.core.hook.dispatcher'
      $formDataProvider: '@MedBook\Booking\Form\SettingsDataProvider'
      $formType: 'MedBook\Booking\Form\SettingsType'
      $hookName: 'MedbookBookingSettings'

