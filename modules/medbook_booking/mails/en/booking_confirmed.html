<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                    <tr>
                        <td style="background-color:#27ae60;padding:30px;text-align:center;">
                            <h1 style="color:#ffffff;margin:0;font-size:24px;">Booking Confirmed!</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:30px;">
                            <p style="font-size:16px;color:#333333;margin:0 0 20px;">
                                Hello <strong>{customer_name}</strong>,
                            </p>
                            <p style="font-size:16px;color:#333333;margin:0 0 20px;">
                                Your booking has been confirmed. Here are the details:
                            </p>
                            <table width="100%" cellpadding="10" cellspacing="0" style="background-color:#f8f9fa;border-radius:6px;margin:0 0 25px;">
                                <tr>
                                    <td style="font-size:14px;color:#666666;border-bottom:1px solid #e9ecef;"><strong>Resource:</strong></td>
                                    <td style="font-size:14px;color:#333333;border-bottom:1px solid #e9ecef;">{resource_name}</td>
                                </tr>
                                <tr>
                                    <td style="font-size:14px;color:#666666;border-bottom:1px solid #e9ecef;"><strong>Date:</strong></td>
                                    <td style="font-size:14px;color:#333333;border-bottom:1px solid #e9ecef;">{booking_date}</td>
                                </tr>
                                <tr>
                                    <td style="font-size:14px;color:#666666;"><strong>Time:</strong></td>
                                    <td style="font-size:14px;color:#333333;">{booking_time}</td>
                                </tr>
                            </table>
                            <p style="font-size:16px;color:#333333;margin:0 0 10px;">
                                We look forward to seeing you!
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#f8f9fa;padding:20px;text-align:center;font-size:12px;color:#999999;">
                            <p style="margin:0;">This is an automated confirmation. Please do not reply directly to this email.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
